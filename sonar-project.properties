# Required Sonar Host URL
sonar.host.url=https://sonar.fly.devops.contus.us
sonar.login=8f27ee30b2cf6036d4d62c687fb9892ef734fcc2
# Project Key and Project name differ for every project/repo and not for branch/feature
sonar.projectKey=Mirrorfly-Gateway-API
sonar.projectName=Mirrorfly-Gateway-API
# Should be changed for every version release
sonar.projectVersion=1.0
# Path to the parent source code directory.
# Example for multiple directory option sonar.sources=srcDir1,srcDir2
sonar.sources=src/main/java
#Path to the tests directory.
sonar.tests=
# Only for Java
# Mention the jave source version 1.7, 1.8
sonar.language=java
sonar.java.source=1.8
# Mention the jave binary file path
sonar.java.binaries=target/*
# Encoding of the source code
sonar.sourceEncoding=UTF-8
# Reusing PHPUnit reports
sonar.php.coverage.reportPath=code/report/codeCoverage.xml
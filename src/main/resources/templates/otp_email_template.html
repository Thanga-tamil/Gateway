<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeTalk OTP</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }

        .header {
            text-align: center;
            background-color: #FFA500;
            /* Orange color */
            padding: 10px 0;
            border-radius: 10px 10px 0 0;
            color: #ffffff;
        }

        .content {
            margin: 20px 0;
            text-align: center;
        }

        .otp {
            font-size: 24px;
            font-weight: bold;
            color: #FFA500;
            /* Orange color */
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #777;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header">
            <h2>SafeTalk</h2>
        </div>
        <div class="content">
            <p>Dear User,</p>
            <p>Your One-Time Password (OTP) for SafeTalk is:</p>
            <p th:class="otp"><span th:text="${otpCode}">123456</span></p>
            <!-- <span th:text="${OTP_CODE}"> -->
            <p>Please use this OTP to complete your action. This OTP is valid for 15 minutes.</p>
        </div>
        <div class="footer">
            <p>&copy; 2024 SafeTalk. All rights reserved.</p>
        </div>
    </div>

</body>

</html>
